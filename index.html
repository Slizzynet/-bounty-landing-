<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION BOARD</title>

<script src="https://www.paypal.com/sdk/js?client-id=AYJrkUdCunqmHyIzD0fL4vylFWemiJsOggQbZ00__2JgpZ0agkeISjKWL-5dgPTEFPet7DO2gH2aNlrF&currency=USD"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#070707;
font-family:Arial,Helvetica,sans-serif;
color:white;
}

header{
text-align:center;
padding:40px;
background:linear-gradient(180deg,#1a0000,#000);
border-bottom:1px solid #ff2a2a55;
}

header h1{
font-size:48px;
letter-spacing:4px;
color:#ff2a2a;
text-shadow:0 0 20px red;
}

.live-bar{
margin-top:15px;
padding:10px;
background:#111;
border-top:1px solid #ff2a2a33;
}

#userCorner{
float:right;
color:#ff2a2a;
font-weight:bold;
}

.container{
width:95%;
max-width:1300px;
margin:auto;
padding:30px 0;
}

.panel{
background:#0e0e0e;
border:1px solid #ff2a2a33;
border-radius:12px;
padding:20px;
margin-bottom:25px;
}

.panel h2{
color:#ff3c3c;
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
margin-bottom:10px;
background:#000;
border:1px solid #ff2a2a55;
border-radius:6px;
color:white;
}

button{
padding:10px 16px;
background:#ff2a2a;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ff4a4a;
box-shadow:0 0 10px red;
}

.flex{
display:flex;
gap:20px;
flex-wrap:wrap;
}

.flex>div{
flex:1;
min-width:280px;
}

.missions-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:20px;
}

.mission-card{
background:#111;
border:1px solid #ff2a2a44;
padding:18px;
border-radius:10px;
cursor:pointer;
}

.mission-card:hover{
transform:scale(1.03);
box-shadow:0 0 15px red;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:flex;
align-items:center;
justify-content:center;
visibility:hidden;
}

.modal.show{
visibility:visible;
}

.modal-content{
background:#111;
border:1px solid #ff2a2a55;
padding:30px;
border-radius:12px;
width:420px;
height:400px;
overflow-y:auto;
}
</style>
</head>

<body>

<header>

<h1>MISSION BOARD</h1>
<p>Competitive bounty challenges</p>

<div class="live-bar">

<span>
👥 Registered Hunters: <span id="userCount">0</span>
&nbsp;&nbsp;|&nbsp;&nbsp;
🟢 Active Now: <span id="liveCount">0</span>
</span>

<span id="userCorner"></span>

</div>

</header>

<div class="container">

<div id="dashboard">

<div class="flex">

<div class="panel">

<h2>Post Mission</h2>

<input id="target" placeholder="Target Player">

<select id="mode">
<option>REC</option>
<option>Theater</option>
<option>Proving Grounds</option>
<option>Park</option>
</select>

<input id="amount" type="number" placeholder="Bounty Amount ($7 minimum)">

<p>Mission expires automatically after 20 days.</p>

<div id="paypal-button-container"></div>

</div>

<div class="panel">

<h2>Leaderboards</h2>

<h3>🏆 Top Hunters</h3>
<ul id="hunterBoard"></ul>

<h3>🎯 Most Wanted</h3>
<ul id="wantedBoard"></ul>

</div>

</div>

<div class="panel">

<h2>Active Hunts</h2>

<div id="missions" class="missions-grid"></div>

</div>

</div>

</div>

<div id="missionModal" class="modal">

<div class="modal-content">

<h2 id="modalTarget"></h2>

<p><b>Mode:</b> <span id="modalMode"></span></p>
<p><b>Bounty:</b> $<span id="modalBounty"></span></p>
<p><b>Expires:</b> <span id="modalDays"></span> days</p>

<input type="file" id="proofFile">

<input id="paypalEmail" placeholder="PayPal Email">

<button>Submit Proof</button>

<br><br>

<input id="addAmount" type="number" placeholder="Add to bounty">

<button>Add to Bounty</button>

<br><br>

<button onclick="closeModal()">Close</button>

</div>

</div>

<script>

const BASE="https://bounty-landing-backend.onrender.com"

let selectedMission=null
let currentUser="guest"

/* LOAD MISSIONS */

async function loadMissions(){

let res=await fetch(BASE+"/missions")
let data=await res.json()

let container=document.getElementById("missions")
container.innerHTML=""

data.forEach(m=>{

let card=document.createElement("div")
card.className="mission-card"

card.innerHTML=`
<h3>${m.target}</h3>
<p>💰 $${m.bounty_amount}</p>
<p>⏳ ${m.days_remaining} days left</p>
`

card.onclick=()=>openMission(m)

container.appendChild(card)

})

}

/* OPEN MODAL */

function openMission(m){

selectedMission=m

document.getElementById("modalTarget").innerText=m.target
document.getElementById("modalMode").innerText=m.reason
document.getElementById("modalBounty").innerText=m.bounty_amount
document.getElementById("modalDays").innerText=m.days_remaining

document.getElementById("missionModal").classList.add("show")

}

/* CLOSE MODAL */

function closeModal(){
document.getElementById("missionModal").classList.remove("show")
}

/* USER COUNT */

async function loadUserCount(){

let res=await fetch(BASE+"/user-count")
let data=await res.json()

document.getElementById("userCount").innerText=data.total

}

/* LIVE USERS */

async function loadLiveUsers(){

let res=await fetch(BASE+"/live-count")
let data=await res.json()

document.getElementById("liveCount").innerText=data.players

}

/* HEARTBEAT */

async function heartbeat(){

await fetch(BASE+"/heartbeat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:currentUser})
})

}

/* PAGE LOAD */

window.onload=()=>{

loadMissions()
loadUserCount()
loadLiveUsers()

setInterval(loadLiveUsers,10000)
setInterval(heartbeat,30000)

}

</script>

</body>
</html>
