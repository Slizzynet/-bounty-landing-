<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MISSION BOARD</title>

<script src="https://www.paypal.com/sdk/js?client-id=AYJrkUdCunqmHyIzD0fL4vylFWemiJsOggQbZ00__2JgpZ0agkeISjKWL-5dgPTEFPet7DO2gH2aNlrF&currency=USD"></script>

<style>

body{
background:#070707;
color:white;
font-family:Arial;
margin:0;
}

header{
text-align:center;
padding:35px;
background:linear-gradient(#1a0000,#000);
border-bottom:1px solid #ff2a2a44;
}

header h1{
color:#ff2a2a;
font-size:46px;
letter-spacing:4px;
}

.live-bar{
margin-top:10px;
background:#111;
padding:10px;
}

.container{
width:95%;
max-width:1200px;
margin:auto;
padding:30px 0;
}

.panel{
background:#0e0e0e;
border:1px solid #ff2a2a44;
padding:20px;
border-radius:10px;
margin-bottom:25px;
}

input,select{
width:100%;
padding:10px;
margin-bottom:10px;
background:black;
border:1px solid #ff2a2a55;
color:white;
}

button{
padding:10px 14px;
background:#ff2a2a;
border:none;
cursor:pointer;
}

.hidden{
display:none;
}

.missions-grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
gap:20px;
}

.mission-card{
background:#111;
border:1px solid #ff2a2a44;
padding:15px;
border-radius:8px;
cursor:pointer;
}

.modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
}

.modal.show{
display:flex;
}

.modal-box{
background:#111;
padding:30px;
border-radius:10px;
width:400px;
}

</style>
</head>

<body>

<header>

<h1>MISSION BOARD</h1>
<p>Competitive bounty challenges</p>

<div class="live-bar">
👥 Registered Hunters: <span id="userCount">0</span>
| 🟢 Active Now: <span id="liveCount">0</span>
</div>

</header>

<div class="container">

<!-- LOGIN PANEL -->

<div id="authPanel" class="panel">

<h2>Login</h2>

<input id="loginEmail" placeholder="Email or Username">
<input id="loginPass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<hr>

<h2>Register</h2>

<input id="regUser" placeholder="Username">
<input id="regEmail" placeholder="Email">
<input id="regPass" type="password" placeholder="Password">

<label>
<input type="checkbox" id="agreeTerms"> I accept Terms & Conditions
</label>

<label>
<input type="checkbox" id="isAdult"> I confirm I am 18+
</label>

<button onclick="register()">Register</button>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="hidden">

<div class="panel">

<h2>Post Mission</h2>

<input id="target" placeholder="Target Player">

<select id="mode">
<option>REC</option>
<option>Park</option>
<option>Theater</option>
<option>Proving Grounds</option>
</select>

<input id="amount" type="number" placeholder="Bounty Amount">

<div id="paypal-button-container"></div>

</div>

<div class="panel">

<h2>Active Hunts</h2>

<div id="missions" class="missions-grid"></div>

</div>

</div>

</div>

<!-- MISSION MODAL -->

<div id="missionModal" class="modal">

<div class="modal-box">

<h2 id="modalTarget"></h2>

<p>Bounty: $<span id="modalBounty"></span></p>

<input type="file" id="proofFile">
<input id="paypalEmail" placeholder="PayPal Email">

<button onclick="submitClaim()">Submit Proof</button>

<br><br>

<button onclick="closeModal()">Close</button>

</div>

</div>


<script>

const BASE="https://bounty-landing-backend.onrender.com"

let currentUser=null
let selectedMission=null

/* REGISTER */

async function register(){

let res=await fetch(BASE+"/register",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:regUser.value,
email:regEmail.value,
password:regPass.value,
agreedTerms:agreeTerms.checked,
isAdult:isAdult.checked
})
})

let data=await res.json()
alert(data.message || data.error)

}

/* LOGIN */

async function login(){

let res=await fetch(BASE+"/login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
email:loginEmail.value,
password:loginPass.value
})
})

let data=await res.json()

if(data.token){

currentUser=data.username

authPanel.classList.add("hidden")
dashboard.classList.remove("hidden")

loadMissions()
heartbeat()

}

}

/* MISSIONS */

async function loadMissions(){

let res=await fetch(BASE+"/missions")
let missions=await res.json()

missionsDiv=document.getElementById("missions")
missionsDiv.innerHTML=""

missions.forEach(m=>{

let card=document.createElement("div")
card.className="mission-card"

card.innerHTML=`
<h3>${m.target}</h3>
<p>$${m.bounty_amount}</p>
<p>${m.days_remaining} days left</p>
`

card.onclick=()=>openMission(m)

missionsDiv.appendChild(card)

})

}

/* MODAL */

function openMission(m){

selectedMission=m

modalTarget.innerText=m.target
modalBounty.innerText=m.bounty_amount

missionModal.classList.add("show")

}

function closeModal(){
missionModal.classList.remove("show")
}

/* CLAIM */

async function submitClaim(){

let form=new FormData()

form.append("missionId",selectedMission.id)
form.append("paypal",paypalEmail.value)
form.append("hunter",currentUser)
form.append("file",proofFile.files[0])

await fetch(BASE+"/claims",{
method:"POST",
body:form
})

alert("Claim submitted")

}

/* COUNTS */

async function loadCounts(){

let u=await fetch(BASE+"/user-count")
let users=await u.json()

userCount.innerText=users.total

let l=await fetch(BASE+"/live-count")
let live=await l.json()

liveCount.innerText=live.players

}

/* HEARTBEAT */

async function heartbeat(){

await fetch(BASE+"/heartbeat",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({username:currentUser})
})

setTimeout(heartbeat,30000)

}

loadCounts()

</script>

</body>
</html>
